# =============================================================================
# 完整预训练配置：类 DeepSeek 架构（MLA + DeepSeekMoE）
# -----------------------------------------------------------------------------
# 用途：产出一个可直接接微调(SFT)与强化(RL)的完整预训练模型。
#
#   attention   = MLA          DeepSeek-V2/V3 的 KV 低秩压缩 + 解耦 RoPE
#                              缓存 224B/token（GQA 是 768B），省 3.4x
#   feedforward = moe_finegrained  DeepSeekMoE 三件套：
#                                 ① 细粒度：16 个窄专家(608) + top-4
#                                 ② 共享专家：1 个常驻，所有 token 都过
#                                 ③ aux-loss-free：可学习 bias 做负载均衡，
#                                    不再用 aux loss 干扰主损失
#   norm / positional = RMSNorm + RoPE（与基线一致，便于对比）
#
# 规模：总 204M / 激活 69.5M（基线 Dense 是 63.9M）
#
# 用法：
#   cd trainer && torchrun --nproc_per_node 4 train.py \
#       --algo pretrain --config configs/pretrain_deepseek.yaml
#
# ⚠️ 该架构与既有 Dense/GQA 权重**不兼容**（q_proj 形状不同），必须 from_weight: none
# =============================================================================
defaults: base.yaml

model:
  hidden_size: 768
  num_hidden_layers: 8
  vocab_size: 6400
  max_position_embeddings: 32768
  rms_norm_eps: 1.0e-6
  tie_word_embeddings: true

# ------------------------------ 注意力：MLA ------------------------------
attention:
  type: mla
  num_attention_heads: 8
  num_key_value_heads: 4
  # d_c：KV 压缩后的 latent 维度。组件默认 512 在 d=768 下过大（缓存反而比 GQA 大），
  # 192 是实测的甜点：缓存 224B/token，且参数量与基线相当
  kv_lora_rank: 192
  # d_c'：query 压缩维度（DeepSeek 也压缩 query 以降参数）
  q_lora_rank: 192
  # 每头拆分：64 不旋转 + 32 解耦 RoPE（DeepSeek 是 128+64，比例 2:1）
  qk_nope_head_dim: 64
  qk_rope_head_dim: 32
  v_head_dim: 64
  flash_attn: true

# ------------------------- 前馈：DeepSeekMoE -------------------------
feedforward:
  type: moe_finegrained
  num_experts: 16                  # 细粒度：专家窄、数量多
  num_experts_per_tok: 4           # 每 token 激活 4 个路由专家
  num_shared_experts: 1            # 常驻共享专家（所有 token 都过）
  moe_intermediate_size: 608       # 单个专家宽度（基线的四分之一）
  aux_loss_free_balance: true      # 用可学习 bias 均衡，替代 aux loss
  bias_update_rate: 1.0e-3
  routed_scaling_factor: 1.0

# ------------------------------ 位置编码 ------------------------------
positional_encoding:
  type: rope
  rope_theta: 1.0e+6
  inference_rope_scaling: false

norm:
  type: rmsnorm

# ------------------------------ 数据 ------------------------------
data:
  # 四份按内容形态拆开的语料（test/storage/split_pretrain_corpus.py 生成），
  # mix 是采样权重：模型看到的比例 = 权重比，与各文件条数无关。
  # 想回到「一份混好的文件」：删掉 mix，把 path 改回 dataset/pretrain/pretrain_t2t.jsonl。
  path: dataset/pretrain
  mix:
    pretrain_t2t.prose.jsonl: 0.70    # 叙述 / 百科
    pretrain_t2t.qa.jsonl:    0.10    # 指令 / 问答（与 SFT 重叠，故意压低）
    pretrain_t2t.en.jsonl:    0.15    # 英文为主（存量约 9%，会重复采样）
    pretrain_t2t.code.jsonl:  0.05    # 含代码
     # 完整版（7.8G / 847 万条）
  max_seq_len: 380                     # README 对完整版数据的推荐值

# ---------------------------- 训练超参 ----------------------------
train:
  save_dir: out
  save_weight: pretrain_deepseek
  epochs: 1
  batch_size: 16                       # MoE 显存占用更高，先用 16（配合累积等效放大）
  accumulation_steps: 16               # 等效 batch = 16 × 16 × 4卡
  learning_rate: 5.0e-4
  grad_clip: 1.0
  log_interval: 50
  save_interval: 2000
  num_workers: 8
  dtype: bfloat16
  seed: 42
  from_weight: none
