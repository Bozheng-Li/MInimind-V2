# =============================================================================
# 默认模型结构（被各阶段配置通过 defaults 引用）
# -----------------------------------------------------------------------------
# 各槽位（norm / positional_encoding / attention / feedforward）都是
# 「type + 该组件需要的参数」的扁平结构：
#   - type 写短名（如 gqa）会命中 arch/ 里已注册的组件
#   - type 也可以写完整 import 路径（如 my_ext.MyAttn），加载仓库外的组件
#   - 参数随便加，组件按需读取；新增组件不需要改框架代码
#
# 默认值精确复现重构前的架构（Dense 64M），因此可加载已有的
# test/out/pretrain_768.pth。
#
# ⚠️ YAML 浮点陷阱：指数必须带符号。写 1.0e+6 才是 float，
#    裸写 1.0e6 会被 PyYAML 当成字符串。
# =============================================================================

# ---------------------------- 全局模型参数 ----------------------------
model:
  hidden_size: 768
  num_hidden_layers: 8
  vocab_size: 6400
  max_position_embeddings: 32768
  rms_norm_eps: 1.0e-6
  dropout: 0.0
  hidden_act: silu
  tie_word_embeddings: true
  bos_token_id: 1
  eos_token_id: 2

# ------------------------------ 归一化 ------------------------------
# 可选: rmsnorm | rmsnorm_zero_centered | layernorm
norm:
  type: rmsnorm

# ----------------------------- 位置编码 -----------------------------
# 可选: rope | partial_rope | nope
positional_encoding:
  type: rope
  rope_theta: 1.0e+6
  inference_rope_scaling: false     # true -> 启用 YaRN 长文本外推

# ------------------------------ 注意力 ------------------------------
# 可选: gqa | gated | sliding_window | mla | compressed | deltanet
#   注: gqa 设 num_key_value_heads=num_attention_heads 即退化为 MHA，
#       设 num_key_value_heads=1 即退化为 MQA，无需单独的实现
attention:
  type: gqa
  num_attention_heads: 8
  num_key_value_heads: 4
  qk_norm: true                     # 对 q/k 按 head_dim 做 RMSNorm
  flash_attn: true                  # 满足条件时走 SDPA

# ----------------------------- 前馈网络 -----------------------------
# 可选: swiglu | geglu | moe | moe_shared | moe_finegrained
feedforward:
  type: swiglu
  intermediate_size: 2432
  # ---- 以下仅在 MoE 类实现时被读取 ----
  num_experts: 4
  num_experts_per_tok: 1
  norm_topk_prob: true
  router_aux_loss_coef: 5.0e-4
  moe_intermediate_size: 2432
