# =============================================================================
# 主线预训练配置：门控注意力 + DeepSeekMoE
# -----------------------------------------------------------------------------
# 架构选型依据来自 test/storage/report/report.md 的 18 组对比实验（61M token 等量预算）：
#
#   attention   = gated    对比实验里**唯一稳健的正收益**（Δloss -0.055，
#                          在 5 个观察点上极差仅 0.007），只多 7% 参数、吞吐基本不掉。
#                          （MLA 虽省 3.4x 缓存，但 loss +0.137，且收益只在推理侧）
#   feedforward = moe_finegrained  细粒度 16 专家 top-4 + 1 共享专家 + aux-loss-free
#                          （等量预算下微正 -0.020；MoE 的容量优势需要更多 token 才显现，
#                            本配置跑 50 token/参数，远高于对比实验的 1 token/参数）
#   norm / pe   = rmsnorm + rope(1e6)
#                          （zero-centered 微正 +0.007；rope_theta 实测不该改，1e4 反而 -0.020）
#
# 规模：总 209.7M / 激活 75.2M（基线 Dense 为 63.9M）
#
# 用法：
#   cd trainer && torchrun --nproc_per_node 4 train.py \
#       --algo pretrain --config configs/pretrain_moe.yaml
#
# 续训第 2 轮：
#   ... 同上，追加 --epochs 2 --from_resume 1
# =============================================================================
defaults: base.yaml

model:
  hidden_size: 768
  num_hidden_layers: 8
  vocab_size: 6400
  max_position_embeddings: 32768
  rms_norm_eps: 1.0e-6
  tie_word_embeddings: true

# -------------------- 注意力：门控注意力（Qwen3-Next 风）--------------------
attention:
  type: gated
  num_attention_heads: 8
  num_key_value_heads: 4
  qk_norm: true
  flash_attn: true

# ------------------- 前馈：细粒度 + 共享 + aux-loss-free -------------------
feedforward:
  type: moe_finegrained
  num_experts: 16                  # 细粒度：专家窄、数量多
  num_experts_per_tok: 4           # 每 token 激活 4 个路由专家
  num_shared_experts: 1            # 常驻共享专家（所有 token 都过）
  moe_intermediate_size: 608       # 单个专家宽度（约为基线的四分之一）
  aux_loss_free_balance: true      # 用可学习 bias 均衡，替代 aux loss
  bias_update_rate: 1.0e-3
  routed_scaling_factor: 1.0

# ------------------------------ 位置编码 ------------------------------
positional_encoding:
  type: rope
  rope_theta: 1.0e+6
  inference_rope_scaling: false

norm:
  type: rmsnorm

# ------------------------------ 数据 ------------------------------
data:
  # 四份按内容形态拆开的语料（test/storage/split_pretrain_corpus.py 生成），
  # mix 是采样权重：模型看到的比例 = 权重比，与各文件条数无关。
  # 想回到「一份混好的文件」：删掉 mix，把 path 改回 dataset/pretrain/pretrain_t2t.jsonl。
  path: dataset/pretrain
  mix:
    pretrain_t2t.prose.jsonl: 0.70    # 叙述 / 百科
    pretrain_t2t.qa.jsonl:    0.10    # 指令 / 问答（与 SFT 重叠，故意压低）
    pretrain_t2t.en.jsonl:    0.15    # 英文为主（存量约 9%，会重复采样）
    pretrain_t2t.code.jsonl:  0.05    # 含代码
     # 完整版（7.8G / 847 万条 / 约 3.2B token）
  max_seq_len: 380                     # README 对完整版数据的推荐值

# ---------------------------- 训练超参 ----------------------------
train:
  save_dir: out
  save_weight: pretrain_moe            # -> test/out/pretrain_moe_768.pth
  epochs: 1
  batch_size: 32
  accumulation_steps: 8                # 等效 batch = 32 × 8 × 4 卡 = 1024（与原版一致）
  learning_rate: 5.0e-4
  grad_clip: 1.0
  log_interval: 50
  save_interval: 2000
  num_workers: 8
  dtype: bfloat16
  seed: 42
  from_weight: none
