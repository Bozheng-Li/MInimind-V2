<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>MiniMind · 训练控制台</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/viz.css">
<link rel="stylesheet" href="/static/lab.css">
<link rel="stylesheet" href="/static/train.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M9 22V10l7 8 7-8v12' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body class="lab-body">
<div class="tc">

  <!-- ============================== 顶栏 ============================== -->
  <header class="tc-top">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="24" height="24"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M9 22V10l7 8 7-8v12" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div>
      <h1>训练控制台</h1>
      <span class="sub" id="tc-sub">选算法 → 选配置 → 覆盖超参 → 起进程</span>
    </div>
    <span class="spacer"></span>
    <span class="chip" id="tc-live"><span class="live-dot"></span>—</span>
    <a class="btn ghost" href="/lab">实验台</a>
    <a class="btn ghost" href="/">对话页</a>
    <button class="icon-btn" id="tc-theme" title="切换主题" aria-label="切换主题">
      <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.7" fill="none"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <!-- ============================== 主体 ============================== -->
  <div class="tc-body">
    <main class="tc-main" id="tc-main"></main>

    <aside class="tc-aside">
      <div class="tc-aside-inner" id="tc-aside"></div>
    </aside>
  </div>
</div>

<script src="/static/viz.js"></script>
<script src="/static/train.js"></script>
</body>
</html>
