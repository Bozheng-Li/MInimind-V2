<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>MiniMind · 实验台</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/viz.css">
<link rel="stylesheet" href="/static/lab.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M9 22V10l7 8 7-8v12' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body class="lab-body">
<div class="lab">

  <!-- ============================== 侧栏 ============================== -->
  <aside class="lab-side">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="26" height="26"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M9 22V10l7 8 7-8v12" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="brand-text">
        <strong>MiniMind</strong>
        <span>实验台 · 全流程</span>
      </div>
    </div>

    <nav class="lab-nav" id="lab-nav" aria-label="实验台导航">
      <span class="nav-group">实验</span>
      <button data-page="library" aria-current="true">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 13h6V4H4v9zm0 7h6v-4H4v4zm10 0h6v-9h-6v9zm0-16v4h6V4h-6z" fill="currentColor"/></svg>
        实验库
      </button>
      <button data-page="pipeline">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 7h5M15 7h5M4 17h5M15 17h5M12 4v16" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round"/><circle cx="12" cy="7" r="2.6" stroke="currentColor" stroke-width="1.7" fill="none"/><circle cx="12" cy="17" r="2.6" stroke="currentColor" stroke-width="1.7" fill="none"/></svg>
        全流程
      </button>
      <button data-page="runs">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 4h12v16H6zM9 8h6M9 12h6M9 16h3" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round"/></svg>
        训练登记
        <span class="nav-badge" id="nav-runs"></span>
      </button>

      <span class="nav-group">训练阶段</span>
      <button data-page="pretrain">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M3 17l5-5 4 3 5-7 4 4" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        预训练
      </button>
      <button data-page="sft">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 19V5m0 14h16M8 15l3.5-4 3 2.5L20 8" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        监督微调
      </button>
      <button data-page="rl">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 3a9 9 0 109 9h-9V3z" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linejoin="round"/></svg>
        强化学习
      </button>

      <span class="nav-group">对比与评测</span>
      <button data-page="sweep">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 6h16M4 12h10M4 18h6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
        架构对比
      </button>
      <button data-page="eval">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M5 4h14v16H5V4zm3 5h8M8 13l2.5 2.5L16 11" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        标准评测
      </button>

      <span class="nav-group">环境</span>
      <button data-page="resources">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 3v7M15 3v7M6 10h12v4a6 6 0 01-6 6 6 6 0 01-6-6v-4zM12 20v1.5" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        资源与配置
      </button>
      <button data-page="logs">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        日志浏览
        <span class="nav-badge" id="nav-logs"></span>
      </button>
    </nav>

    <div class="lab-side-foot">
      <a class="btn primary block" href="/train">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M8 5l11 7-11 7V5z" fill="currentColor"/></svg>
        训练控制台
      </a>
      <button class="btn ghost block" id="lab-refresh">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M20 12a8 8 0 11-2.3-5.6M20 4v4h-4" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        刷新数据
      </button>
      <div class="stat-line" id="lab-stat">读取中…</div>
      <a class="text-btn" href="/">← 回到对话页</a>
    </div>
  </aside>

  <!-- ============================== 主区 ============================== -->
  <main class="lab-main">
    <header class="lab-top">
      <h1 id="lab-title">实验库</h1>
      <span class="chip" id="lab-sub">—</span>
      <span class="spacer"></span>
      <span class="chip" id="lab-live" title="实时资源占用"><span class="live-dot"></span>—</span>
      <button class="icon-btn" id="lab-theme" title="切换深浅色主题" aria-label="切换主题">
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.7" fill="none"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <div class="lab-scroll" id="lab-scroll" tabindex="-1"></div>
  </main>
</div>

<script src="/static/viz.js"></script>
<script src="/static/lab.js"></script>
</body>
</html>
